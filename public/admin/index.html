<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>JBeatsArt — Admin</title>
  <link rel="icon" type="image/png" href="../favicon.png" />
  <!-- the theme that repaints the panel to match the public site -->
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="login.css" />
  <!-- Netlify Identity: email login for admins. Remove if you use a different backend. -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Decap CMS (self-hosted copy, see vite.config.js) renders the whole admin UI from config.yml.
       It is started by hand below, once we know which login this host uses. -->
  <script>window.CMS_MANUAL_INIT = true</script>
  <script src="decap-cms.js"></script>
  <!-- Fixed left navigation, back-to-list after publishing, friendlier picture picker -->
  <script src="shell.js"></script>
  <!-- The Orders screen: what has been paid through Stripe, and the posting of each order -->
  <script src="orders.js"></script>
  <!-- Starts the panel; on Vercel it first asks for the passcode, on this page (no second window) -->
  <script src="login.js"></script>
  <script>
    // After an invited user sets a password, send them to the admin instead of the home page.
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', (user) => {
        if (!user) window.netlifyIdentity.on('login', () => { document.location.href = '/admin/' })
      })
    }
  </script>
</body>
</html>
