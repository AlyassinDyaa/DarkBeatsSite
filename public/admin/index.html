<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>DarkBeats — Admin</title>
  <link rel="icon" type="image/png" href="../favicon.png" />
  <!-- the theme that repaints the panel to match the public site -->
  <link rel="stylesheet" href="admin.css" />
  <!-- Netlify Identity: email login for admins. Remove if you use a different backend. -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Decap CMS (self-hosted copy, see vite.config.js) renders the whole admin UI from config.yml.
       It is started by hand below, once we know which login this host uses. -->
  <script>window.CMS_MANUAL_INIT = true</script>
  <script src="decap-cms.js"></script>
  <!-- Fixed left navigation, back-to-list after publishing, friendlier picture picker -->
  <script src="shell.js"></script>
  <script>
    // Which login? On this computer and on Netlify: whatever config.yml says (local proxy, or
    // Netlify Identity). On Vercel the build leaves a backend.json: log in with the admin passcode
    // at this site's own /api/auth, save through /api/gh (which holds the GitHub token, so nobody
    // logging in needs a GitHub account), and every Save goes straight to the site.
    fetch('backend.json', { cache: 'no-store' })
      .then((r) => (r.ok ? r.json() : null))
      .catch(() => null) // no such file (the dev server answers with a page, which is not JSON)
      .then((backend) => {
        if (backend && backend.name) {
          window.CMS.init({ config: { backend: { ...backend, base_url: location.origin, auth_endpoint: 'api/auth', api_root: `${location.origin}/api/gh` }, publish_mode: 'simple' } })
        } else {
          window.CMS.init()
        }
      })
  </script>
  <script>
    // After an invited user sets a password, send them to the admin instead of the home page.
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', (user) => {
        if (!user) window.netlifyIdentity.on('login', () => { document.location.href = '/admin/' })
      })
    }
  </script>
</body>
</html>
