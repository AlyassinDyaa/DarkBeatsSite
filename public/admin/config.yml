# JBeatsArt — admin panel configuration (Decap CMS)
# Everything on the site that the artist can edit is described here.
# Changes are saved as commits to the repository; the site rebuilds automatically.
#
# The panel has three kinds of section (public/admin/shell.js groups them in the navigation):
#   1. things that are added to over time: Shop, Work, Then and now, Conventions;
#      (the Shop's pieces live in content/work and the Work page's sections in
#      content/gallery-sections: the folders keep the names the pages had first)
#   2. the words on each page: one short form per page ("pages" below);
#   3. things that apply to the whole site: name and colour, and what is shown or hidden ("site").

backend:
  name: git-gateway        # Netlify Identity + Git Gateway. On Vercel the admin page swaps this for a passcode login.
  branch: main
  commit_messages:
    create: 'Content: add {{collection}} "{{slug}}"'
    update: 'Content: update {{collection}} "{{slug}}"'
    delete: 'Content: remove {{collection}} "{{slug}}"'
    uploadMedia: 'Content: upload {{path}}'
    deleteMedia: 'Content: remove {{path}}'

# `npm run dev` starts a local helper on port 8082 so the panel can be used without logging in.
local_backend:
  url: http://localhost:8082/api/v1

publish_mode: simple

media_folder: public/uploads
public_folder: /uploads

site_url: /
display_url: /
# The sidebar already links to the site; Decap's own "View Live" lookups only add error notices.
show_preview_links: false
logo_url: /favicon.png

# One clean form column; the built-in preview only echoes field values.
editor:
  preview: false

collections:
  # ------------------------------------------------------------------ 1. added to over time
  - name: work
    label: Shop
    label_singular: Piece
    description: 'Your finished pieces, with a price each. A new one appears on the Shop page, the home page and the Work page.'
    folder: content/work
    create: true
    extension: json
    format: json
    identifier_field: title
    slug: '{{slug}}'
    summary: '{{title}} — {{category}}'
    sortable_fields: [date, title, category]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: category, label: Category, widget: relation, collection: site, file: categories, value_field: 'subjects.*.name', search_fields: ['subjects.*.name'], display_fields: ['subjects.*.name'], hint: 'Heroes, Villains... Kept under Shop categories.' }
      - { name: type, label: Type, widget: relation, collection: site, file: categories, value_field: 'types.*.name', search_fields: ['types.*.name'], display_fields: ['types.*.name'], hint: 'Posters, Stickers... Kept under Shop categories.' }
      - { name: universe, label: Universe, widget: relation, collection: site, file: categories, value_field: 'universes.*.name', search_fields: ['universes.*.name'], display_fields: ['universes.*.name'], required: false, hint: 'Optional: DC, Marvel, Star Wars... Kept under Shop categories.' }
      - { name: date, label: Date, widget: datetime, format: 'YYYY-MM-DD', date_format: 'D MMM YYYY', time_format: false, picker_utc: true, hint: 'Newest pieces come first.' }
      - { name: link, label: Link to the post, widget: string, required: false, hint: 'The Instagram post, if there is one.' }
      - name: status
        label: Status
        widget: select
        default: none
        required: false
        options:
          - { label: 'Normal', value: none }
          - { label: 'New (shows a "New" tag)', value: new }
          - { label: 'On sale (shows the old and the new price)', value: sale }
          - { label: 'Sold out (no Buy button)', value: soldout }
        hint: 'The Sale and Sold out tags show while online purchases are switched on; New always shows.'
      - { name: salePrice, label: Sale price, widget: number, value_type: float, min: 0, required: false, hint: 'Only used while the status is "On sale", and only when it is lower than the price.' }
      - { name: price, label: Price, widget: number, value_type: float, min: 0, required: false, hint: 'A number, in the currency set under "Shop & payments". Only shown, with its Buy button, while online purchases are switched on there. Leave empty for a piece that is not for sale. Sold in sizes? Add them under "Sizes and prices" at the bottom instead.' }
      - { name: src, label: Picture, widget: image, choose_url: false, required: false, hint: 'Portrait, about 5:7 (for example 1500×2100px).' }
      - { name: hover, label: Second picture (on hover), widget: image, choose_url: false, required: false, hint: 'Optional: the print in a frame, on a wall, a close-up... On the Shop page it fades in when someone points at the piece. Same shape as the first.' }
      - { name: face, label: As a profile picture, widget: facecrop, required: false, hint: 'A buyer of this print can use it as their profile picture. Drag the picture inside the circle to put the face in place, and zoom in.' }
      - { name: note, label: A few words about it, widget: text, required: false, hint: 'Shown beside the picture when it is opened.' }
      - { name: featured, label: Show on the home page, widget: boolean, default: false, required: false, hint: 'Up to six ticked pieces are listed on the home page. With none ticked, the six newest are.' }
      - { name: hidden, label: Hide from the site, widget: boolean, default: false, required: false, hint: 'Takes it off the site but keeps it here.' }
      - name: sizes
        label: Sizes and prices
        label_singular: size
        widget: list
        collapsed: false
        minimize_collapsed: true
        required: false
        summary: '{{fields.name}}'
        hint: 'Optional, for a piece sold in more than one size (A3, A2, 30 × 40 cm...). Each size has its own price; its discount price is used while the status is "On sale". With sizes here, the price above is not used.'
        fields:
          - { name: name, label: Size, widget: string }
          - { name: price, label: Price, widget: number, value_type: float, min: 0 }
          - { name: salePrice, label: Discount, widget: number, value_type: float, min: 0, required: false }

  - name: gallery_sections
    label: Work
    label_singular: Section
    description: 'The Work page, in sections you name yourself (Sketches, Commissions, Convention photos...). Open a section to add pictures.'
    folder: content/gallery-sections
    create: true
    extension: json
    format: json
    identifier_field: title
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Section name, widget: string }
      - { name: order, label: Order on the page, widget: number, value_type: int, default: 10, hint: 'Lower numbers come first.' }
      - { name: description, label: Short description, widget: string, required: false }
      - name: from
        label: Fill it from the Shop
        widget: select
        default: none
        options:
          - { label: 'No, only the pictures added below', value: none }
          - { label: 'Every piece in the Shop', value: all }
          - { label: 'Heroes', value: Heroes }
          - { label: 'Villains', value: Villains }
          - { label: 'Horror', value: Horror }
          - { label: 'Games', value: Games }
          - { label: 'Original', value: Original }
          - { label: 'Commissions', value: Commissions }
        hint: 'Saves uploading a finished piece twice: the section shows those pieces first, then the pictures below.'
      - name: items
        label: Pictures
        label_singular: picture
        widget: list
        collapsed: false
        required: false
        summary: '{{fields.title}}'
        hint: 'Drag to reorder.'
        fields:
          - { name: src, label: Picture, widget: image, choose_url: false, hint: 'Any shape; it is shown uncropped.' }
          - { name: title, label: Title, widget: string, required: false }
          - { name: note, label: A few words about it, widget: text, required: false }
          - { name: home, label: Show on the home page, widget: boolean, default: false, required: false, hint: 'The home page shows up to six of these pictures, ticked ones first.' }
      - { name: hidden, label: Hide from the site, widget: boolean, default: false, required: false, hint: 'Takes the whole section off the site but keeps it here.' }

  - name: redraws
    label: Then and now
    label_singular: Set
    description: 'The same subject drawn again years later. Visitors drag a line across to compare the two.'
    folder: content/redraws
    create: true
    extension: json
    format: json
    identifier_field: title
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: text, label: One line about it, widget: string, required: false }
      - name: stages
        label: Drawings
        label_singular: Drawing
        widget: list
        min: 2
        summary: '{{fields.year}}'
        hint: 'Oldest first. The last one is the "now" side.'
        fields:
          - { name: year, label: Year, widget: string }
          - { name: src, label: Picture, widget: image, choose_url: false, required: false, hint: 'Portrait, about 5:7. Use the same shape for every drawing in a set.' }
      - { name: order, label: Order on site, widget: number, value_type: int, default: 10, required: false, hint: 'Lower numbers come first.' }
      - { name: hidden, label: Hide from the site, widget: boolean, default: false, required: false }

  - name: events
    label: Conventions
    label_singular: Event
    description: 'Where people can meet you in person: conventions, markets, signings.'
    folder: content/events
    create: true
    extension: json
    format: json
    identifier_field: name
    slug: '{{slug}}'
    summary: '{{name}} — {{when}}'
    sortable_fields: [order, name]
    fields:
      - { name: name, label: Event, widget: string }
      - { name: when, label: When, widget: string, hint: 'Written the way it should read: "14–15 Nov 2026", or "Dates to be announced".' }
      - { name: role, label: Where to find you there, widget: string, required: false, hint: 'For example "Artist Alley, table 42".' }
      - { name: place, label: City or venue, widget: string, required: false }
      - { name: url, label: Link, widget: string, required: false }
      - { name: order, label: Order on site, widget: number, value_type: int, default: 10, required: false, hint: 'Lower numbers come first.' }
      - { name: hidden, label: Hide from the site, widget: boolean, default: false, required: false }

  # ------------------------------------------------------------------ 2. the words on each page
  - name: pages
    label: Page text
    files:
      - name: home
        label: Home page
        file: content/pages/home.json
        fields:
          - { name: kicker, label: Small line above the name, widget: string, required: false }
          - { name: text, label: Sentence under the tagline, widget: text, required: false }
          - name: buttons
            label: Buttons under the name
            label_singular: button
            widget: list
            collapsed: false
            required: false
            max: 3
            summary: '{{fields.label}} ({{fields.page}})'
            hint: 'Up to three, from the left in this order; one button sits on the left by itself. Drag to reorder. A button to a page that is switched off is left out.'
            fields:
              - { name: label, label: Wording, widget: string }
              - name: page
                label: Goes to
                widget: select
                default: work
                options:
                  - { label: 'Work page', value: work }
                  - { label: 'Shop', value: shop }
                  - { label: 'Commissions', value: commissions }
                  - { label: 'About', value: about }
                  - { label: 'Contact', value: contact }
                  - { label: 'Support', value: support }
                  - { label: 'Another address', value: link }
              - name: style
                label: Look
                widget: select
                default: filled
                options:
                  - { label: 'Filled (purple)', value: filled }
                  - { label: 'Outline', value: outline }
              - { name: url, label: Address, widget: string, required: false, hint: 'Only for "Another address": the full address, starting with https://' }
          - name: wallShow
            label: What the wall shows
            widget: select
            default: list
            required: false
            options:
              - { label: 'My list below (as it was)', value: list }
              - { label: 'A category and/or universe', value: pick }
              - { label: 'Random: the whole Shop, mixed on every visit', value: random }
            hint: 'Handy for a season: Horror in October, DC villains for a month... Switch back to your list any time; it is kept.'
          - { name: wallCategory, label: Category, widget: relation, collection: site, file: categories, value_field: 'subjects.*.name', search_fields: ['subjects.*.name'], display_fields: ['subjects.*.name'], required: false, hint: 'Empty: any category.' }
          - { name: wallUniverse, label: Universe, widget: relation, collection: site, file: categories, value_field: 'universes.*.name', search_fields: ['universes.*.name'], display_fields: ['universes.*.name'], required: false, hint: 'Empty: any universe. If nothing in the Shop matches both, the wall shows your list.' }
          - name: wall
            label: Pictures on the wall
            label_singular: picture
            widget: list
            collapsed: true
            minimize_collapsed: true
            required: false
            summary: '{{fields.piece}}{{fields.title}} ({{fields.column}} column)'
            hint: 'The drifting columns of pictures beside the name. Drag to reorder: they fill the columns in this order. Pick a piece from the Shop (clicking it then shows its price and Buy button), or upload a picture of its own. Leave the list empty to show every Shop piece.'
            fields:
              - { name: piece, label: Shop piece, widget: relation, collection: work, value_field: '{{slug}}', search_fields: [title], display_fields: [title], required: false, hint: 'Pick one, or leave empty and upload a picture below.' }
              - name: column
                label: Column
                widget: select
                default: any
                required: false
                options:
                  - { label: 'Any (the shortest)', value: any }
                  - { label: 'Left', value: left }
                  - { label: 'Middle', value: middle }
                  - { label: 'Right', value: right }
              - { name: picture, label: Or a picture of its own, widget: image, choose_url: false, required: false }
              - { name: title, label: Its title, widget: string, required: false }
          - { name: wallAddNew, label: New Shop pieces join the wall by themselves, widget: boolean, default: true, required: false, hint: 'On: a Shop piece that is not in the list above is added at its end. Off: the wall shows only the list.' }
          - { name: wallSpeed, label: How fast the wall drifts, widget: slider, min: 25, max: 300, step: 5, default: 100, unit: '%', required: false, hint: '100 is the usual pace; 200 twice as fast, 50 half.' }
          - name: figure
            label: Character
            widget: object
            collapsed: false
            fields:
              - { name: src, label: Picture, widget: image, choose_url: false, required: false, hint: 'A cut-out with a see-through background (PNG or WebP). Remove it to have the name on its own.' }
              - name: layer
                label: Where it stands
                widget: select
                default: behind
                required: false
                options:
                  - { label: 'Behind the whole name', value: behind }
                  - { label: 'Between the two words', value: between }
              - { name: ground, label: It stands on something, widget: boolean, default: false, required: false, hint: 'For a full figure on a floor or roof.' }
              - { name: size, label: Size, widget: slider, min: 50, max: 150, step: 1, default: 100, unit: '%', required: false }
              - { name: x, label: Move sideways, widget: slider, min: -100, max: 100, step: 1, default: 0, required: false }
              - { name: y, label: Move up or down, widget: slider, min: -100, max: 100, step: 1, default: 0, required: false }
          - { name: heroPreview, label: Live preview, widget: heropreview, required: false }
          - { name: marquee, label: Words, widget: list, hint: 'Separate them with commas.' }
          - { name: latestLabel, label: Small label, widget: string, required: false }
          - { name: latestTitle, label: Heading, widget: string }
          - { name: galleryLabel, label: Small label, widget: string, required: false }
          - { name: galleryTitle, label: Heading, widget: string }
          - name: galleryView
            label: How the pictures are laid out to start with
            widget: select
            default: wall
            required: false
            options:
              - { label: 'Wall: columns, nothing cropped', value: wall }
              - { label: 'Grid: even tiles', value: grid }
              - { label: 'Strip: one row you scroll sideways', value: strip }
              - { label: 'Spotlight: one big picture with the rest beside it', value: spotlight }
            hint: 'Visitors can switch between these four; this is the one they see first, on the home page and the Work page.'
          - { name: redrawLabel, label: Small label, widget: string, required: false }
          - { name: redrawTitle, label: Heading, widget: string }
          - { name: redrawText, label: Text, widget: text, required: false }
          - { name: commissionsTitle, label: Heading, widget: string }
          - { name: commissionsButton, label: Button, widget: string }
          - { name: eventsLabel, label: Small label, widget: string, required: false }
          - { name: eventsTitle, label: Heading, widget: string }

      - name: lists
        label: Shop and Work pages
        file: content/pages/lists.json
        fields:
          - { name: workLabel, label: Small label, widget: string, required: false }
          - { name: workTitle, label: Heading, widget: string }
          - { name: workIntro, label: Introduction, widget: text, required: false }
          - { name: galleryLabel, label: Small label, widget: string, required: false }
          - { name: galleryTitle, label: Heading, widget: string }
          - { name: galleryIntro, label: Introduction, widget: text, required: false }

      - name: commissions
        label: Commissions page
        file: content/pages/commissions.json
        fields:
          - { name: open, label: Commissions are open, widget: boolean, default: true, hint: 'Switches the "Commissions open" light in the top bar and on the page.' }
          - { name: title, label: Heading, widget: string }
          - { name: intro, label: Introduction, widget: text }
          - name: tiers
            label: Offers
            label_singular: Offer
            widget: list
            summary: '{{fields.name}} — {{fields.price}}'
            fields:
              - { name: name, label: Name, widget: string }
              - { name: text, label: Description, widget: text }
              - { name: price, label: Price, widget: string, required: false, hint: 'Written the way it should read: "From $80 AUD". Empty shows "Ask for a quote".' }
              - { name: includes, label: What is included, widget: list, required: false, hint: 'Separate them with commas.' }
          - { name: processLabel, label: Small label, widget: string, required: false }
          - { name: processTitle, label: Heading, widget: string }
          - name: steps
            label: Steps
            label_singular: Step
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: title, label: Step, widget: string }
              - { name: text, label: Description, widget: text }
          - { name: requestLabel, label: Small label, widget: string, required: false }
          - { name: requestTitle, label: Heading while open, widget: string }
          - { name: closedTitle, label: Heading while closed, widget: string }
          - { name: closedText, label: Text while closed, widget: text, required: false }
          - name: notes
            label: Points
            label_singular: Point
            widget: list
            required: false
            field: { name: text, label: Point, widget: string }

      - name: about
        label: About page
        file: content/pages/about.json
        fields:
          - { name: title, label: Heading, widget: string }
          - name: paragraphs
            label: Paragraphs
            label_singular: Paragraph
            widget: list
            field: { name: text, label: Paragraph, widget: text }
          - name: facts
            label: Facts
            label_singular: Fact
            widget: list
            required: false
            summary: '{{fields.label}}: {{fields.value}}'
            fields:
              - { name: label, label: Label, widget: string }
              - { name: value, label: Value, widget: string }

      - name: contact
        label: Contact page
        file: content/pages/contact.json
        fields:
          - { name: label, label: Small label, widget: string, required: false }
          - { name: title, label: Heading, widget: string }
          - { name: intro, label: Introduction, widget: text }
          - { name: topics, label: Choices in the "About" drop-down, widget: list, required: false, hint: 'What a visitor can say their message is about. Separate them with commas. With none, the drop-down is left out.' }

      - name: account
        label: Customer account page
        file: content/pages/account.json
        fields:
          - { name: noteTitle, label: Heading of your note, widget: string, required: false, hint: 'Shown to every customer on their account page, signed by you.' }
          - { name: note, label: Your note to customers, widget: text, required: false, hint: 'A few warm lines. Empty: no note.' }
          - { name: signature, label: Signed, widget: string, required: false }
          - { name: collectionTitle, label: Heading over the prints they own, widget: string, required: false }
          - { name: savedTitle, label: Heading over the pieces they saved, widget: string, required: false }
          - name: icons
            label: Free profile pictures
            label_singular: picture
            widget: list
            collapsed: false
            required: false
            summary: '{{fields.name}}'
            hint: 'Pictures any customer can choose for their profile (square works best). Prints a customer buys also become pictures that only they can use.'
            fields:
              - { name: picture, label: Picture, widget: image, choose_url: false }
              - { name: name, label: Name, widget: string, required: false }

      - name: support
        label: Support page
        file: content/pages/support.json
        fields:
          - { name: label, label: Small label, widget: string, required: false }
          - { name: title, label: Name of the project, widget: string }
          - { name: logo, label: Logo, widget: image, choose_url: false, required: false, hint: 'The project''s title as a picture with a see-through background. Without one, the name is written in the site''s lettering.' }
          - { name: figure, label: Character picture, widget: image, choose_url: false, required: false, hint: 'A cut-out with a see-through background, shown large beside the logo.' }
          - { name: intro, label: Introduction, widget: text, required: false }
          - { name: primaryLabel, label: Button, widget: string, hint: 'Jumps down to the ways to give.' }
          - { name: aboutLabel, label: Small label, widget: string, required: false }
          - { name: aboutTitle, label: Heading, widget: string }
          - name: paragraphs
            label: Paragraphs
            label_singular: Paragraph
            widget: list
            required: false
            field: { name: text, label: Paragraph, widget: text }
          - name: facts
            label: Facts
            label_singular: Fact
            widget: list
            required: false
            summary: '{{fields.label}}: {{fields.value}}'
            fields:
              - { name: label, label: Label, widget: string }
              - { name: value, label: Value, widget: string }
          - { name: poster, label: Poster, widget: image, choose_url: false, required: false, hint: 'A finished picture, shown framed beside the text and on the home page.' }
          - { name: artLabel, label: Small label, widget: string, required: false }
          - { name: artTitle, label: Heading, widget: string }
          - name: art
            label: Pictures
            label_singular: picture
            widget: list
            required: false
            summary: '{{fields.title}}'
            hint: 'Drag to reorder.'
            fields:
              - { name: src, label: Picture, widget: image, choose_url: false }
              - { name: title, label: Title, widget: string, required: false }
              - { name: note, label: A few words about it, widget: text, required: false }
          - { name: supportLabel, label: Small label, widget: string, required: false }
          - { name: supportTitle, label: Heading, widget: string }
          - { name: supportText, label: Text, widget: text, required: false }
          - name: tiers
            label: Amounts
            label_singular: Amount
            widget: list
            required: false
            summary: '{{fields.amount}} — {{fields.name}}'
            hint: 'Each amount gets a button once it has a payment link.'
            fields:
              - { name: amount, label: Amount, widget: string, hint: 'Written the way it should read: "$5", "A$15".' }
              - { name: name, label: Name, widget: string }
              - { name: text, label: What it helps with, widget: text, required: false }
              - { name: url, label: Payment link, widget: string, required: false, hint: 'The address of a payment page for this amount: a Stripe Payment Link (buy.stripe.com/...), or a Ko-fi, PayPal.me or Buy Me a Coffee address. Without a link the amount is shown with no button.' }
          - { name: customLabel, label: 'Any amount: button', widget: string }
          - { name: customUrl, label: 'Any amount: payment link', widget: string, required: false, hint: 'A payment page where the giver types the amount. In Stripe: Payment Links, New, "Customers choose what to pay". Visitors can type their own amount on the site; with a Stripe or PayPal.me link it is carried over, so the payment page opens with it already filled in.' }
          - { name: giveArt, label: Picture beside the amounts, widget: image, choose_url: false, required: false, hint: 'A cut-out with a see-through background works best. Optional.' }
          - { name: payNote, label: Line under the button, widget: text, required: false }
          - { name: soonTitle, label: 'Before any link is in: heading', widget: string, required: false }
          - { name: soonText, label: 'Before any link is in: text', widget: string, required: false, hint: 'Shown with your email address after it, until the first payment link is added.' }
          - { name: goalLabel, label: What you are raising for, widget: string, required: false, hint: 'For example "Print run for issue 1". The bar only shows once the target is above 0.' }
          - { name: goalSign, label: Currency sign, widget: string, required: false, default: '$', hint: 'Shown before the goal figures and before the amount a visitor types.' }
          - { name: goalRaised, label: Raised so far, widget: number, value_type: int, required: false, default: 0, hint: 'You update this by hand.' }
          - { name: goalTarget, label: Target, widget: number, value_type: int, required: false, default: 0 }
          - name: notes
            label: Points
            label_singular: Point
            widget: list
            required: false
            field: { name: text, label: Point, widget: string }
          - { name: homeLabel, label: Small label, widget: string, required: false }
          - { name: homeText, label: Text, widget: text, required: false }
          - { name: homeButton, label: Button, widget: string }

  # ------------------------------------------------------------------ 3. the whole site
  - name: site
    label: Site
    files:
      - name: brand
        label: Name, colour and contact
        file: content/site/brand.json
        fields:
          - { name: name, label: Site name, widget: string, hint: 'Written with capitals where the parts start ("JBeatsArt"), the last part takes the brand colour.' }
          - { name: artist, label: Your name, widget: string }
          - { name: tagline, label: Tagline, widget: string }
          - { name: blurb, label: One or two sentences about the site, widget: text, hint: 'Shown in the footer, and by search engines and link previews.' }
          - { name: hue, label: Brand colour, widget: slider, min: 0, max: 360, step: 1, default: 312, unit: '°', hint: 'Tints the whole site. 312 is the purple. 25 red, 55 orange, 145 green, 200 teal, 250 blue, 340 pink.' }
          - { name: logo, label: Logo, widget: image, choose_url: false, required: false, hint: 'Optional. A small square picture shown beside the name in the top bar.' }
          - { name: logoSize, label: Logo size, widget: slider, min: 24, max: 64, step: 1, default: 42, unit: 'px', required: false, hint: 'Its height in the top bar. On a phone it stops at 46.' }
          - name: logoShape
            label: Logo shape
            widget: select
            default: circle
            required: false
            options:
              - { label: 'Circle', value: circle }
              - { label: 'Rounded square', value: rounded }
              - { label: 'Square', value: square }
              - { label: 'As uploaded (no cropping)', value: natural }
          - { name: icon, label: Browser tab icon, widget: image, choose_url: false, required: false, hint: 'The small picture in the browser tab, in bookmarks, and on a phone''s home screen when the site is added there. A square picture, at least 180×180 pixels; a PNG with a see-through background around a round shape looks round. Leave empty for the JBeatsArt logo.' }
          - { name: email, label: Contact email, widget: string }
          - { name: location, label: Location, widget: string, required: false }
          - { name: contactAction, label: Form service address, widget: string, required: false, hint: 'Optional. With an address from a form service (Formspree and the like) the forms send there. Empty, they open the visitor''s mail app.' }
          - name: social
            label: Links
            label_singular: Link
            widget: list
            required: false
            summary: '{{fields.label}} {{fields.handle}}'
            fields:
              - { name: label, label: Network, widget: string, hint: 'Instagram, Threads, TikTok, X, Facebook, YouTube and ArtStation get their own icon. The Instagram link is also the "More on Instagram" button on the Gallery page.' }
              - { name: handle, label: Handle, widget: string, required: false }
              - { name: url, label: Address, widget: string }
          - { name: footerLine, label: Big line across the footer, widget: string, required: false }
          - { name: footerFine, label: Small print after the © line, widget: string, required: false }

      - name: shop
        label: Shop and payments
        file: content/site/shop.json
        fields:
          - { name: enabled, label: Online purchases, widget: boolean, default: false, hint: 'On: every piece with a price shows it, with a Buy button that opens a payment page. Off: no prices and no buttons anywhere.' }
          - name: payments
            label: Payment methods
            widget: select
            default: stripe
            required: false
            options:
              - { label: 'Stripe (cards, Apple Pay, Google Pay)', value: stripe }
              - { label: 'PayPal', value: paypal }
              - { label: 'Both: buyers choose', value: both }
            hint: 'Each needs its keys in the Vercel project settings: STRIPE_SECRET_KEY for Stripe; PAYPAL_CLIENT_ID and PAYPAL_CLIENT_SECRET for PayPal (sandbox keys while testing; add PAYPAL_MODE = live for real ones). Discount codes work with Stripe payments only.'
          - name: accounts
            label: Customer accounts
            widget: select
            default: 'off'
            required: false
            options:
              - { label: 'Off: everyone buys as a guest', value: 'off' }
              - { label: 'Optional: buyers can make an account, or buy as a guest', value: optional }
              - { label: 'Required: an account is needed to buy', value: required }
            hint: 'An account keeps the cart on every device and shows the buyer their orders and tracking. Needs the database: MONGODB_URI in the Vercel project settings (and RESEND_API_KEY + MAIL_FROM for the password and confirmation emails).'
          - { name: currency, label: Currency, widget: select, default: aud, options: [{ label: 'Australian dollar (AUD)', value: aud }, { label: 'US dollar (USD)', value: usd }, { label: 'Euro (EUR)', value: eur }, { label: 'British pound (GBP)', value: gbp }, { label: 'New Zealand dollar (NZD)', value: nzd }, { label: 'Canadian dollar (CAD)', value: cad }] }
          - { name: buttonLabel, label: Wording of the Buy button, widget: string }
          - name: cartIcon
            label: Cart button icon
            widget: select
            default: bag
            required: false
            options:
              - { label: 'Shopping bag', value: bag }
              - { label: 'Shopping cart', value: cart }
            hint: 'The button in the top bar that opens the cart.'
          - { name: note, label: What the buyer gets, widget: string, required: false, hint: 'One line under every price and on the payment page, for example "A3 print, signed."' }
          - { name: signedChoice, label: Buyers can add a signature, widget: boolean, default: false, required: false, hint: 'On: every piece has a "Signed by …" switch beside its price, off to start with; the order says signed or unsigned (in Stripe, after the title). Off: no switch.' }
          - { name: signedExtra, label: Extra for a signed print, widget: number, value_type: float, min: 0, default: 0, required: false, hint: 'Added to the price when the buyer switches the signature on. 0 for no extra cost.' }
          - name: pricePlace
            label: Price on the cards
            widget: select
            default: corner
            required: false
            options:
              - { label: 'Top corner of the picture', value: corner }
              - { label: 'Under the picture, beside the title', value: below }
          - name: tagPlace
            label: Tags on the cards
            widget: select
            default: corner
            required: false
            hint: 'The New, Sale and Sold out tags.'
            options:
              - { label: 'Top corner of the picture', value: corner }
              - { label: 'Under the title', value: below }
          - { name: shipping, label: Ask for a delivery address, widget: boolean, default: true, required: false, hint: 'On for anything you post. Off for downloads.' }
          - { name: countries, label: Countries you post to, widget: list, required: false, hint: 'Two-letter country codes, separated by commas: AU, NZ, US, CA, GB.' }
          - { name: thanksTitle, label: Heading, widget: string, required: false }
          - { name: thanksText, label: Text, widget: string, required: false }

      - name: categories
        label: Shop categories
        file: content/site/categories.json
        fields:
          - name: subjects
            label: Categories
            label_singular: category
            widget: list
            collapsed: false
            summary: '{{fields.name}}'
            hint: 'Heroes, Villains, Horror... Drag to reorder. Renaming one does not rename it on the pieces that use it.'
            fields:
              - { name: name, label: Name, widget: string }
          - name: types
            label: Types
            label_singular: type
            widget: list
            collapsed: false
            summary: '{{fields.name}}'
            hint: 'Posters, Foil posters, Stickers, Shirts... Beside each, what the buyer gets (shown under the price); leave it empty to use the line from Shop and payments.'
            fields:
              - { name: name, label: Name, widget: string }
              - { name: note, label: What the buyer gets, widget: string, required: false }
          - name: universes
            label: Universes
            label_singular: universe
            widget: list
            collapsed: false
            required: false
            summary: '{{fields.name}}'
            hint: 'DC, Marvel, Star Wars... Optional on each piece. Lets the wall on the home page show, say, only DC villains.'
            fields:
              - { name: name, label: Name, widget: string }

      - name: visibility
        label: Show or hide
        file: content/site/visibility.json
        fields:
          - name: pages
            label: Pages
            widget: object
            collapsed: false
            hint: 'A page that is switched off also leaves the menu.'
            fields:
              - { name: work, label: Shop, widget: boolean, default: true }
              - { name: gallery, label: Work, widget: boolean, default: true }
              - { name: commissions, label: Commissions, widget: boolean, default: true }
              - { name: about, label: About, widget: boolean, default: true }
              - { name: contact, label: Contact, widget: boolean, default: true }
              - { name: support, label: Support, widget: boolean, default: true }
          - name: home
            label: Parts of the home page
            widget: object
            collapsed: false
            fields:
              - { name: ticker, label: Moving band of words, widget: boolean, default: true }
              - { name: latest, label: Latest pieces, widget: boolean, default: true }
              - { name: gallery, label: Work, widget: boolean, default: true }
              - { name: redraws, label: Then and now, widget: boolean, default: true }
              - { name: commissions, label: Commissions, widget: boolean, default: true }
              - { name: support, label: Your own project (Support), widget: boolean, default: true }
              - { name: events, label: Conventions, widget: boolean, default: true }
          - name: shop
            label: Parts of the Shop page
            widget: object
            collapsed: false
            fields:
              - { name: redraws, label: Then and now, widget: boolean, default: true, hint: 'The before-and-after drawings under the pieces.' }
          - name: admin
            label: Admin
            widget: object
            collapsed: false
            fields:
              - { name: samples, label: Sample orders, customers and discounts, widget: boolean, default: false, required: false, hint: 'Fills Orders, Customers and Discounts with made-up data, to try them out. Nothing in it is real, and nothing you do to it reaches Stripe. Switch it off before going live.' }
